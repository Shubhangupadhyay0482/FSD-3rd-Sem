<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration Form</h1>
        <p class="subtitle">Please enter your details</p>

        <form id="studentForm">

        
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">

        
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

        
            <label for="phone">Phone Number</label>
            <label for="countryCode">Country Code:</label>
            <input type="text" id="countryCode" placeholder="+91" maxlength="3" border="1px solid #ccc" style="width: 60px; margin-right: 10px;">
            <label for="phone">Mobile Number:</label>
            <input type="text" id="phone" placeholder="9876543210" maxlength="10">
            <input type="number" id="phone" placeholder="Enter your phone number">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob">
            <label>Gender</label>
            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <!-- 6. Course -->
            <label for="course">Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="B.Tech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="B.Sc">B.Sc</option>
                <option value="MCA">MCA</option>
            </select>

    
            <label for="branch">Branch</label>
            <select id="branch">
                <option value="">Select Branch</option>
                <option value="CSE">Computer Science</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics & Communication</option>
                <option value="ME">Mechanical</option>
                <option value="CE">Civil</option>
            </select>

            <label for="roll">Roll Number</label>
            <input type="number" id="roll" placeholder="Enter roll number">


            <label for="address">Address</label>
            <textarea id="address" placeholder="Enter your address"></textarea>

        
            <label for="city">City</label>
            <input type="text" id="city" placeholder="Enter your city">


            <button type="submit">Submit Registration</button>

        </form>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
